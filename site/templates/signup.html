<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; color: #111; margin: 0; }
  main { max-width: 500px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 2.2rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 28px; font-size: 1.1rem; }
  .row { display: flex; gap: 20px; }
  input, select { width: 100%; box-sizing: border-box; padding: 14px; margin-bottom: 16px;
    border: 1px solid #e3e6ea; border-radius: 8px; font-size: 1rem; }
  select { background: #f8f9fa; width: 45%; }
  button { width: 100%; padding: 14px; margin-top: 20px; border: 0; border-radius: 8px;
    background: #2176f5; color: #fff; font-weight: 700; text-transform: uppercase; cursor: pointer; }
  .hp { position: absolute; left: -10000px; }
  .msg { padding: 12px; border-radius: 8px; margin-bottom: 16px; }
  .error { background: #fde8e8; color: #9b1c1c; }
  .success { background: #e7f7ed; color: #1e6b3a; }
</style>
</head>
<body>
<main>
  <h1>Create Account</h1>
  <p class="sub">to start using privacy protecting email service</p>
  {% if error %}<div class="msg error" id="error">{{ error }}</div>{% endif %}
  {% if success %}<div class="msg success" id="success">{{ success }}</div>{% endif %}
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="hp" aria-hidden="true">
      <input type="text" name="website" tabindex="-1" autocomplete="off">
    </div>
    <div class="row">
      <input name="username" placeholder="choose email" value="{{ username or '' }}" required>
      <select name="domain">
        {% for d in domains %}<option value="{{ d }}">@{{ d }}</option>{% endfor %}
      </select>
    </div>
    <input type="password" name="password" placeholder="password" required>
    <input type="password" name="repeat" placeholder="repeat password" required>
    <input name="coupon" placeholder="if you have please enter coupon code here">
    <button type="submit">Sign up</button>
  </form>
</main>
</body>
</html>
